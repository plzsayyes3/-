name: Check private staff access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token is configured
        env:
          STAFF_REPO_TOKEN: ${{ secrets.STAFF_REPO_TOKEN }}
        run: |
          if [ -z "$STAFF_REPO_TOKEN" ]; then
            echo "STAFF_REPO_TOKEN is not configured in Repository secrets."
            exit 1
          fi
          echo "STAFF_REPO_TOKEN is configured."

      - name: Checkout private staff repository
        uses: actions/checkout@v4
        with:
          repository: plzsayyes3/childacare-staff
          token: ${{ secrets.STAFF_REPO_TOKEN }}
          path: _private/childacare-staff
          persist-credentials: false
          fetch-depth: 1

      - name: Verify staff database
        run: |
          test -f _private/childacare-staff/data/staff.json
          node -e "const f=require('./_private/childacare-staff/data/staff.json'); if(!Array.isArray(f.staff)) process.exit(1); console.log('Private staff access OK. staff records:', f.staff.length)"

      # Important:
      # _private/childacare-staff is runner-local temporary data only.
      # Do not print staff contents, upload them as artifacts, or include them in GitHub Pages.
